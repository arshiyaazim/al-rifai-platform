name: CI

on:
  push:
    branches: [main, feature/phase3-router-cash-vessel]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22.x'
  PG_VERSION: '16'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

  domain-integration-tests:
    name: Domain Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alrifai_app
          POSTGRES_PASSWORD: owner-secret
          POSTGRES_DB: alrifai_v2
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alrifai_app -d alrifai_v2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install disposable database schema
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: alrifai_v2
          PGUSER: alrifai_app
          PGPASSWORD: owner-secret
        run: |
          node --experimental-strip-types scripts/standalone/install.mjs --preflight
          node --experimental-strip-types scripts/standalone/install.mjs \
            --admin-user owner --admin-password 'test-secret' --admin-name 'Owner'

      - name: Run domain integration tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: alrifai_v2
          PGUSER: alrifai_app
          PGPASSWORD: owner-secret
        run: pnpm test:standalone

  router-tests:
    name: Router Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alrifai_app
          POSTGRES_PASSWORD: owner-secret
          POSTGRES_DB: alrifai_v2
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alrifai_app -d alrifai_v2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install disposable database schema
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: alrifai_v2
          PGUSER: alrifai_app
          PGPASSWORD: owner-secret
        run: |
          node --experimental-strip-types scripts/standalone/install.mjs --preflight
          node --experimental-strip-types scripts/standalone/install.mjs \
            --admin-user owner --admin-password 'test-secret' --admin-name 'Owner'

      - name: Run router tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: alrifai_v2
          PGUSER: alrifai_app
          PGPASSWORD: owner-secret
        run: node --experimental-strip-types --test tests/standalone/message-router.test.mjs

  migration-validation:
    name: Migration Validation
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alrifai_app
          POSTGRES_PASSWORD: owner-secret
          POSTGRES_DB: alrifai_v2
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alrifai_app -d alrifai_v2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply full migration chain to disposable DB
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: alrifai_v2
          PGUSER: alrifai_app
          PGPASSWORD: owner-secret
        run: |
          node --experimental-strip-types scripts/standalone/install.mjs --preflight
          node --experimental-strip-types scripts/standalone/install.mjs \
            --admin-user owner --admin-password 'test-secret' --admin-name 'Owner'

      - name: Verify schema version is 1.3.0
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: alrifai_v2
          PGUSER: alrifai_app
          PGPASSWORD: owner-secret
        run: |
          VERSION=$(PGPASSWORD=$PGPASSWORD psql -h $PGHOST -p $PGPORT -U $PGUSER -d $PGDATABASE -t -A -c "SELECT value FROM schema_meta WHERE key = 'schema_version'")
          test "$VERSION" = "1.3.2"

  nextjs-build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Next.js build
        run: pnpm build

  docker-build-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Validate Dockerfile syntax
        run: |
          test -f Dockerfile
          grep -E '^FROM ' Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        run: |
          docker build --target build -t al-rifai-platform:ci-test .

      - name: Verify no production secrets in repo
        run: |
          if grep -rE 'PGPASSWORD|ALRIFAI_REVIEW_PASSWORD|\.env$' --include='*.ts' --include='*.mjs' --include='*.sql' --include='*.yml' --include='*.yaml' . --exclude-dir=node_modules --exclude-dir=.git | grep -v '.env.example' | grep -v 'process.env'; then
            echo "ERROR: Potential secret found in repository"
            exit 1
          fi

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - unit-tests
      - domain-integration-tests
      - router-tests
      - migration-validation
      - nextjs-build
      - docker-build-validation
    if: always()
    steps:
      - name: Report results
        run: |
          echo "CI completed for ${{ github.ref }}"
          echo "All required checks: ${{ needs.lint-and-typecheck.result }} ${{ needs.unit-tests.result }} ${{ needs.migration-validation.result }} ${{ needs.nextjs-build.result }}"
