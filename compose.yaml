name: al-rifai-v2

# AL-RIFA'I Platform — one image, two processes, no extra infrastructure.
#   app   Next.js behind the existing TLS certificate
#   sync  WhatsApp store importer/tailer (reads the bridge SQLite, never writes it)
services:
  app:
    image: local/al-rifai-platform:${ALRIFAI_TAG:-v2.8.1-port-cleanup}
    command: ["node", "deploy/tls-entry.mjs"]
    init: true
    restart: unless-stopped
    user: "10001:10001"
    # The WA-01 bridge socket is group-owned by the bridge account (GID 10002).
    # A supplementary group gives the nonroot app read/write access without
    # changing the socket's 0660 permissions.
    group_add:
      - "10002"
    # One configuration file for the whole installation. It is the source of
    # truth for the web app, the installer, the importer and the sync worker.
    env_file:
      - /opt/vps/al-rifai-standalone/apps/al-rifai/.env
    ports:
      - "0.0.0.0:443:3443"
    environment:
      # Captured attachments live outside the image and the Git checkout.
      ALRIFAI_MEDIA_DIR: /media
    volumes:
      # The TLS key pair is mounted read-only from the host; it stays a file so
      # the certificate can be renewed without touching configuration.
      - type: bind
        source: /etc/vps/apps/al-rifai/tls/private-entry.key
        target: /etc/alrifai/tls/private-entry.key
        read_only: true
      - type: bind
        source: /etc/vps/apps/al-rifai/tls/private-entry.crt
        target: /etc/alrifai/tls/private-entry.crt
        read_only: true
      # Read-only: the app streams bytes it can see, the worker writes them.
      - type: bind
        source: /var/lib/vps/al-rifai/media
        target: /media
        read_only: true
      # WA-01 bridge control socket (0660 bridge group) and the narrow outbound
      # token. Both read-only; the app never writes the bridge store.
      - type: bind
        source: /var/lib/vps/whatsapp/wa-01/control
        target: /wa-01-control
        read_only: true
      - type: bind
        source: /etc/vps/apps/al-rifai/auth/wa-01-send.token
        target: /etc/alrifai/wa-01-send.token
        read_only: true
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  sync:
    image: local/al-rifai-platform:${ALRIFAI_TAG:-v2.8.1-port-cleanup}
    command: ["node", "scripts/sync-worker.mjs", "--mode=tail"]
    init: true
    restart: unless-stopped
    # The bridge store directories are 0700 and owned by the bridge user. A
    # read-only root process is the only way to read them without weakening
    # those permissions, which are preserved exactly as they are.
    user: "0:0"
    env_file:
      - /opt/vps/al-rifai-standalone/apps/al-rifai/.env
    environment:
      # Host paths in `.env`, container paths here. The bridge layout does not
      # change, so no second configuration file is needed.
      WA01_DB: /wa/wa-01/messages.db
      WA02_DB: /wa/wa-02/messages.db
      ALRIFAI_MEDIA_DIR: /media
    volumes:
      - type: bind
        source: /var/lib/vps/whatsapp/wa-01/store
        target: /wa/wa-01
        read_only: true
      - type: bind
        source: /var/lib/vps/whatsapp/wa-02/store
        target: /wa/wa-02
        read_only: true
      # Writable: new attachments are written here, outside the image.
      - type: bind
        source: /var/lib/vps/al-rifai/media
        target: /media
        read_only: false
    networks: [backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 192m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

networks:
  backend:
    external: true
    name: vps-backend
